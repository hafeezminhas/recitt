<div class="modal-header">
  <h4>{{ title }}</h4>
</div>
<div class="modal-body">
  <div class="p-3 bg-light border rounded" style="max-height: 300px; overflow-y: auto;">
    {{ content }}
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-outline-danger" (click)="activeModal.close(false)">Decline</button>
  <button class="btn btn-success" (click)="activeModal.close(true)">I Accept</button>
</div>
