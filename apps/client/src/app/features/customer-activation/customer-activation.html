<div
  class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center"
>
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <h2>
                <svg
                  [cIcon]="icons.cilCheck"
                  size="xxl"
                  [attr.style]="activationResult$$()?.status? 'color:var(--cui-success)':'color:var(--cui-danger)'"
                  title="cil-check Icon"
                ></svg>
                {{activationResult$$()?.status? 'Activation successful':
                'Activation failed'}}
              </h2>
              <p class="text-body-secondary ml-8">
                {{activationResult$$()?.message}}
              </p>

              <p>
                You can now signin to your account.
                <a cButton color="secondary" class="w-100" routerLink="/login"
                  >Login</a
                >
              </p>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
