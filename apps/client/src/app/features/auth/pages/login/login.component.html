<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form [formGroup]="loginForm" cForm (ngSubmit)="onSubmit()">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>

                  <input cFormControl autoComplete="username" id="username" placeholder="username"
                    formControlName="username" required />

                  <!-- @if (submitted && f['username'].valid) { -->
                  <c-form-feedback [valid]="f['username']?.valid && f['username']?.touched">Please provide the
                    username.</c-form-feedback>
                  <!-- } -->
                  <!-- @if (submitted && f['username'].errors?.['pattern']) {
                    <c-form-feedback [valid]="f['username']?.valid && f['username']?.touched" >Please provide the username.</c-form-feedback>
                  } -->


                </c-input-group>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input id="password" autoComplete="current-password" cFormControl placeholder="Password"
                    formControlName="password" type="password" />
                </c-input-group>
                <c-row>
                  @if (error$$()) {
                  <c-col xxs="12" class="mb-4">
                    <c-alert color="danger" variant="solid" class="d-flex align-items-center">
                      <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Info:">
        <use xlink:href="#exclamation-triangle-fill" />
    </svg>
                      <div>{{ error$$()?.message }}</div>
                  </c-alert>
                  </c-col>
                  }
                </c-row>
                <c-row>
                  <c-col xs="6">
                    <button cButton class="px-4" color="primary" type="submit">
                      @if(loading$$()) {
                      <c-spinner size="sm" class="me-2" />
                      }
                      <span>{{ loading ? 'Loading…' : 'Login' }}</span>
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="6">
                    <button cButton class="px-0" color="link">
                      Forgot password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [style.minWidth.%]="44" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Sign up</h2>
                <p>
                  Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed
                  do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </p>
                <button [active]="true" cButton class="mt-3" color="primary" routerLink="/register">
                  Register Now!
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
