<div class="account-details">
  @if(error$$()){
  <c-alert color="danger">{{error$$()?.message}}</c-alert>
  } @if(account$$()){
  <c-row class="gx-6 px-4">
    <c-col xs="12" md="6" class="px">
      <c-col class="mb-3">
        <app-info-tile label="Name" [value]="account$$()?.name" />
      </c-col>
      <c-col class="mb-3">
        <app-info-tile label="Address">
          <div [innerHTML]="account$$()?.address | ukAddress"></div>
        </app-info-tile>
      </c-col>
      <c-col class="mb-3">
        <app-info-tile label="Email Address" [value]="account$$()?.email" />
      </c-col>
      <c-col class="mb-3">
        <app-info-tile label="Phone Number" [value]="account$$()?.phone" />
      </c-col>
      <c-col class="mb-3">
        <app-info-tile
          label="Alternate Phone"
          [value]="account$$()?.alternatePhone" />
      </c-col>
    </c-col>
    <c-col xs="12" md="6" class="px">
      <c-col class="mb-3">
        <app-info-tile
          label="Registration Number"
          [value]="account$$()?.registrationNumber" />
      </c-col>
      <c-col class="mb-3">
        <app-info-tile
          label="Registration Type"
          [value]="account$$()?.registrationType" />
      </c-col>
      @if(account$$()?.registrationDate) {
      <c-col class="mb-3">
        <app-info-tile
          label="Registration Date"
          [value]="account$$()?.registrationDate | date:'shortDate' " />
      </c-col>
      }
      <c-col class="mb-3">
        <app-info-tile
          label="Is Vat Registered?"
          [value]="account$$()?.isVatRegistered? 'Yes' : 'No'" />
      </c-col>
      <c-col class="mb-3">
        <app-info-tile label="VAT Number"
        [value]="account$$()?.vatNumber" />
      </c-col>
    </c-col>
  </c-row>
  } @else{
  <form [formGroup]="accountForm" cForm [validated]="submitted">
    <c-row class="gx-6 px-4">
      <c-col xs="12" md="6" class="px">
        <div class="mb-3">
          <label cLabel for="name">Name</label>
          <input
            cFormControl
            id="name"
            placeholder="Business name"
            formControlName="name"
            required
          />
          <c-form-feedback [valid]="f['name']?.valid && f['name']?.touched"
            >Please provide the business name.</c-form-feedback
          >
        </div>
        <div class="mb-3">
          <label cLabel for="registrationNumber">Registration Number</label>
          <input
            cFormControl
            id="registrationNumber"
            placeholder="Registration number"
            formControlName="registrationNumber"
            required
          />
          <c-form-feedback
            [valid]="f['registrationNumber']?.valid && f['registrationNumber']?.touched"
          >
            Please provide the registration number.</c-form-feedback
          >
        </div>
        <div class="mb-3">
          <label cLabel for="registrationType">Registration Type</label>
          <select
            id="registrationType"
            formControlName="registrationType"
            cSelect
            aria-label="Business registration type"
          >
            @for (option of businessAccountTypes; track option) {
            <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>
        <div class="mb-3">
          <label cLabel for="registrationDate">Registration Date</label>
          <input
            cFormControl
            id="registrationDate"
            type="date"
            formControlName="registrationDate"
          />
        </div>
        <div class="mb-3">
          <label cLabel for="email">Email Address</label>
          <input
            cFormControl
            id="email"
            placeholder="Email address"
            formControlName="email"
            required
          />
          <c-form-feedback [valid]="f['email']?.valid && f['email']?.touched">
            Please provide the email.</c-form-feedback
          >
        </div>
        <div class="mb-3">
          <label cLabel for="phoneNumber">Phone Number</label>
          <input
            cFormControl
            id="phoneNumber"
            placeholder="+44(0)2082894332"
            formControlName="phone"
          />
          <c-form-feedback
            [valid]="f['phoneNumber']?.valid && f['phoneNumber']?.touched"
          >
            Please provide the phone number.</c-form-feedback
          >
        </div>
        <div class="mb-3">
          <label cLabel for="alternativePhoneNumber">Alternative Phone</label>
          <input
            cFormControl
            id="alternativePhoneNumber"
            placeholder="+44(0)2082894333"
            formControlName="alternatePhone"
          />
        </div>
      </c-col>
      <c-col xs="12" md="6" class="px">
        <fieldset formGroupName="address">
          <div class="mb-3">
            <label cLabel for="addressLine1">Building</label>
            <input
              cFormControl
              id="addressLine1"
              placeholder="Street address, P.O. box"
              formControlName="building"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="addressLine2">Street</label>
            <input
              cFormControl
              id="addressLine2"
              placeholder="Apartment, suite, unit, building, floor"
              formControlName="street"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="town">Town</label>
            <input
              cFormControl
              id="town"
              placeholder="Town or city"
              formControlName="town"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="county">County</label>
            <input
              cFormControl
              id="county"
              placeholder="County or state"
              formControlName="county"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="postcode">Postcode</label>
            <input
              cFormControl
              id="postcode"
              placeholder="Postcode or ZIP code"
              formControlName="postcode"
            />
          </div>
        </fieldset>
        <div class="mb-3">
          <input
            cFormCheckInput
            type="checkbox"
            id="isVatRegistered"
            formControlName="isVatRegistered"
          />
          <label cFormCheckLabel for="isVatRegistered" type="checkbox"
            >Is VAT Registered?</label
          >
        </div>
        @if(accountForm.get('isVatRegistered')?.value) {
        <div class="mb-3">
          <label cLabel for="vatNumber">VAT Number</label>
          <input
            cFormControl
            id="vatNumber"
            placeholder="VAT number"
            formControlName="vatNumber"
          />
        </div>
        }
      </c-col>
    </c-row>
  </form>
  }
</div>
